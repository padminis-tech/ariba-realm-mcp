name: Deploy Ariba Realm MCP

on:
  push:
    branches:
      - main

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ariba-realm-mcp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Log in to GitHub Container Registry ───────────────────────────
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Build and push Docker image ───────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ── 4. Set up kubectl with Kyma kubeconfig ───────────────────────────
      - name: Set up kubectl
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "${{ secrets.KUBECONFIG_DATA }}" > /tmp/kube_raw
          FIRST_LINE=$(head -1 /tmp/kube_raw)
          if echo "$FIRST_LINE" | grep -q "^apiVersion"; then
            echo "[kubectl setup] Secret is raw YAML — using directly"
            cp /tmp/kube_raw $HOME/.kube/config
          else
            echo "[kubectl setup] Secret appears base64-encoded — decoding"
            base64 --decode /tmp/kube_raw | tr -d '\r' > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config
          rm -f /tmp/kube_raw
          kubectl config view --minify 2>&1 | head -5

      # ── 5. Deploy to Kyma ────────────────────────────────────────────────
      - name: Deploy to Kyma
        run: |
          kubectl set image deployment/ariba-realm-mcp \
            ariba-realm-mcp=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --namespace=default
          kubectl rollout status deployment/ariba-realm-mcp \
            --namespace=default \
            --timeout=120s

      # ── 6. Verify ────────────────────────────────────────────────────────
      - name: Verify health
        run: |
          echo "Deployment complete."
          kubectl get pods -l app=ariba-realm-mcp -n default
