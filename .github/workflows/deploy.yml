name: Deploy Ariba Realm MCP

on:
  push:
    branches:
      - main

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ariba-realm-mcp

jobs:
  # ── Job 1: Build and push Docker image ──────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  # ── Job 2: Deploy to Kyma ────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Kyma
        run: |
          # Write kubeconfig AND run kubectl in the SAME shell
          mkdir -p $HOME/.kube
          printf '%s' "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode | tr -d '\r' > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          export KUBECONFIG=$HOME/.kube/config

          # Verify cluster connection
          echo "Connecting to: $(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"

          # Deploy new image
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Deploying: $IMAGE"

          kubectl set image deployment/ariba-realm-mcp \
            ariba-realm-mcp=$IMAGE \
            --namespace=default

          # Wait for rollout
          kubectl rollout status deployment/ariba-realm-mcp \
            --namespace=default \
            --timeout=120s

          kubectl get pods -l app=ariba-realm-mcp -n default
